[vars]
deploy_dir = "../websites/zzamboni.org/static/vita/"
build_script_url = "https://raw.githubusercontent.com/zzamboni/resume-toolkit/refs/heads/main/build-resume.sh"
deploy_name = "zamboni-vita"

[tasks.deploy]
description = "Build a resume JSON file and deploy the generated vita site"
usage = '''
arg "<resume>" help="JSON resume file to build and deploy"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

orig_resume="$usage_resume"

if [[ ! -f "$orig_resume" ]]; then
  echo "Resume file not found: $orig_resume" >&2
  exit 1
fi

build_script="$(mktemp)"
trap 'rm -f "$build_script"' EXIT
curl --fail --location --silent --show-error "{{vars.build_script_url}}" --output "$build_script"
chmod +x "$build_script"

dest_dir="${DEPLOY_DIR:-{{vars.deploy_dir}}}"
commit_message="${DEPLOY_COMMIT_MESSAGE:-Update generated vita output [skip ci]}"
resume="{{vars.deploy_name}}.json"

cp $orig_resume $resume

stem="$(basename "$resume" .json)"
src_dir="$PWD/build/$stem/vita"

rm -rf "build/{{vars.deploy_name}}"
"$build_script" --no-it "$resume"

if [[ ! -d "$src_dir" ]]; then
  echo "Expected build output not found: $src_dir" >&2
  exit 1
fi

echo "Copying output files $src_dir to $dest_dir"
mkdir -p "$dest_dir"
rsync -a --verbose --delete --exclude='*.typ' "$src_dir"/ "$dest_dir"/

if git -C "$dest_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  echo "Pushing changes from $dest_dir"
  git -C "$dest_dir" add -A

  if git -C "$dest_dir" diff --cached --quiet; then
    echo "No staged changes to commit in $dest_dir"
    exit 0
  fi

  git -C "$dest_dir" commit -m "$commit_message"
  git -C "$dest_dir" push
fi
'''

[tasks.sync-website]
description = "Build the CV and sync JSON/PDF/BibTeX into a local zzamboni.org checkout (without committing)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
website_dir="$(dirname "$(dirname "${DEPLOY_DIR:-{{vars.deploy_dir}}}")")"
bash scripts/sync-website.sh --website-dir "$website_dir" "$@"
'''
